version: '3.9'

services:
  app:
    container_name: nest_app_prod
    build:
      context: .
      dockerfile: Dockerfile.prod
    restart: always
    depends_on:
      - postgres
    env_file:
      - .env.prod
    networks:
      - prod_network
    environment:
      NODE_ENV: production
    command: ["npm", "run", "start:prod"]

  postgres:
    container_name: nest_postgres_prod
    image: pgvector/pgvector:pg15-trixie
    restart: always
    environment:
      POSTGRES_USER: nestuser
      POSTGRES_PASSWORD: nestpassword
      POSTGRES_DB: nestdb
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    networks:
      - prod_network

  nginx:
    container_name: nginx_prod
    image: nginx:latest
    restart: always
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - certbot_www:/var/www/certbot
      - certbot_conf:/etc/letsencrypt
    networks:
      - prod_network

  migration:
    container_name: nest_migration_prod
    build:
      context: .
      dockerfile: Dockerfile.migrate
    depends_on:
      - postgres
    networks:
      - prod_network
    env_file:
      - .env.prod
    environment:
      NODE_ENV: production
    command: ["npm", "run", "migration:run"]

  certbot:
    container_name: certbot_prod
    image: certbot/certbot:latest
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_conf:/etc/letsencrypt

networks:
  prod_network:
    driver: bridge

volumes:
  postgres_data_prod:
  certbot_www:
  certbot_conf: