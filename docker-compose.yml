version: '3.9'

services:
  app:
    container_name: nest_app
    build: .
    restart: unless-stopped
    ports:
      - '3000:3000'
    volumes:
      - .:/app
      - /app/node_modules
    env_file:
      - .env
    depends_on:
      - postgres
    networks:
      - nest_network

  postgres:
    image: pgvector/pgvector:pg15-trixie
    container_name: nest_postgres
    environment:
      POSTGRES_USER: nestuser
      POSTGRES_PASSWORD: nestpassword
      POSTGRES_DB: nestdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - nest_network

networks:
  nest_network:
    driver: bridge

volumes:
  postgres_data: