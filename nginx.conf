events {}

http {
  client_max_body_size 2G;
  server {
    listen 80;
    server_name fogueira-magica.com;

    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  server {
    listen 443 ssl;
    server_name fogueira-magica.com;

    ssl_certificate /etc/letsencrypt/live/fogueira-magica.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fogueira-magica.com/privkey.pem;

    location / {
      proxy_pass http://app:3000;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 84602s;
      proxy_buffering off;
      proxy_cache off;
    }
  }
}